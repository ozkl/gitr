<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- gitr logo: a main line with a branch that splits off and merges back. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#3730A3"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- macOS icon grid: 824×824 body centred on the 1024 canvas. -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
  </g>

  <g filter="url(#soft)" stroke-linecap="round" fill="none">
    <!-- Branch: leaves the first commit, has its own commit, merges into the last. -->
    <path d="M 410 316 C 410 430, 640 404, 640 512 C 640 620, 410 594, 410 708"
          stroke="url(#branch)" stroke-width="54"/>
    <!-- Main line. -->
    <path d="M 410 300 L 410 724" stroke="#F8FAFC" stroke-width="54"/>
  </g>

  <!-- Commits. -->
  <g>
    <circle cx="410" cy="300" r="66" fill="#312E81" stroke="#F8FAFC" stroke-width="30"/>
    <circle cx="410" cy="512" r="44" fill="#312E81" stroke="#F8FAFC" stroke-width="24"/>
    <circle cx="640" cy="512" r="66" fill="#312E81" stroke="#FBBF24" stroke-width="30"/>
    <circle cx="410" cy="724" r="66" fill="#F8FAFC" stroke="#F8FAFC" stroke-width="30"/>
    <circle cx="410" cy="724" r="26" fill="#312E81"/>
  </g>
</svg>
